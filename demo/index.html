<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf1ef">
<title>Claudia · Morning tablet check</title>
<style>
:root { --ink:#101311; --muted:#56605b; --mist:#edf1ef; --lime:#c6f432; --amber:#ffb23e; --coral:#ff5a3c; font:100%/1.45 "Atkinson Hyperlegible Next",system-ui,sans-serif; color:var(--ink); background:var(--mist); }
* { box-sizing:border-box; }
body { margin:0; }
button { cursor:pointer; font:inherit; color:inherit; }
button:focus-visible { outline:3px solid var(--ink); outline-offset:4px; }
::selection { color:var(--ink); background:var(--lime); }
main { width:min(1160px,94%); margin:0 auto; padding-bottom:2rem; }
header { display:flex; align-items:center; justify-content:space-between; padding:1.15rem 0; border-bottom:1px solid #bfcbc4; }
.brand { font-weight:780; font-size:1.65rem; letter-spacing:-.04em; }
.reset { background:transparent; border:0; padding:.65rem; text-decoration:underline; text-underline-offset:4px; }
h1 { font-size:clamp(2.6rem,5vw,4.3rem); letter-spacing:-.04em; line-height:1; margin:clamp(1.6rem,4vw,3rem) 0 1.6rem; }
.layout { display:grid; grid-template-columns:1.24fr 1fr; gap:1rem; }
section { padding:clamp(1.25rem,3.2vw,2.8rem); border-radius:20px; min-width:0; }
h2,p { margin:0; }
h2 { font-size:1.05rem; font-weight:650; }
.senior { background:white; }
.role { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; }
.role time,.date { color:var(--muted); font-size:.9rem; font-variant-numeric:tabular-nums; }
.voice { display:grid; justify-items:center; text-align:center; gap:1.15rem; margin:1.7rem auto; }
.orb { position:relative; width:6rem; aspect-ratio:1; border-radius:50%; display:flex; gap:4px; align-items:center; justify-content:center; isolation:isolate; }
.orb::before,.orb::after { content:""; position:absolute; border-radius:inherit; z-index:-1; }
.orb::before { inset:0; background:conic-gradient(var(--lime),var(--amber),var(--coral),var(--amber),var(--lime)); filter:blur(4px); }
.orb::after { inset:8%; background:radial-gradient(circle at 45% 30%,white 20%,#e3e8e5); }
.orb i { background:var(--ink); width:4px; height:12px; border-radius:6px; }
.orb i:nth-child(2),.orb i:nth-child(4) { height:22px; }
.orb i:nth-child(3) { height:32px; }
@media (prefers-reduced-motion:no-preference) { .speaking i { animation:sound .7s ease-in-out infinite alternate; } .speaking i:nth-child(even) { animation-direction:alternate-reverse; } @keyframes sound { from { transform:scaleY(.35); } to { transform:scaleY(1); } } }
.quote { font:italic clamp(1.65rem,3vw,2.4rem)/1.18 Newsreader,Georgia,serif; max-width:24ch; min-height:3.54em; text-wrap:balance; }
.play { display:inline-flex; align-items:center; justify-content:center; gap:.65rem; padding:.65rem 1.1rem; border-radius:100px; border:0; background:var(--ink); color:white; font-weight:650; }
.play::before { content:""; border-style:solid; border-width:5px 0 5px 8px; border-color:transparent transparent transparent currentColor; }
.play:hover { background:#33423a; }
fieldset { border:0; border-top:1px solid #dae0dc; padding:1rem 0 0; margin:0; }
legend { float:left; width:100%; margin:0 0 .6rem; padding:0; color:var(--muted); font-size:.95rem; }
.choices { clear:both; display:flex; flex-wrap:wrap; gap:.5rem; }
.choices button { border:1px solid #bfc9c2; background:white; padding:.6rem 1rem; min-height:44px; border-radius:12px; font-weight:600; }
.choices button:hover { border-color:var(--ink); }
.choices button[aria-pressed=true] { background:var(--lime); border-color:var(--ink); }
.diary { background:var(--ink); color:white; }
.diary .date { color:#c1cdc6; }
.diary-title { font-size:clamp(2rem,4vw,3.3rem); font-weight:650; line-height:1.05; letter-spacing:-.04em; margin:2.65rem 0 1.4rem; }
.entry { display:grid; grid-template-columns:3.5rem 1fr; gap:.75rem; border-top:1px solid #435149; padding:1rem 0; }
.entry time { color:#c1cdc6; font-variant-numeric:tabular-nums; }
.entry strong,.entry span { display:block; }
.entry strong { font-size:1.12rem; }
.entry span { color:#c1cdc6; margin-top:.3rem; }
.entry[data-status] strong { color:var(--lime); }
.entry[data-status="forgot"] strong { color:var(--amber); }
.mic-note { margin:.6rem 0 0; font-size:.875rem; color:var(--muted); }
footer { margin:1rem 0 0; color:var(--muted); font-size:.87rem; }
@media (max-width:740px) { .layout { grid-template-columns:1fr; } .voice { margin:1.4rem 0; } .diary-title { margin:1.65rem 0 1.1rem; } }
</style>
</head>
<body>
<main>
  <header><span class="brand">Claudia</span><button class="reset" id="restart">Restart demo</button></header>
  <h1>Morning tablet check</h1>
  <div class="layout">
    <section class="senior" aria-labelledby="grete">
      <div class="role"><h2 id="grete">Grete’s phone</h2><time id="phone-time">08:00</time></div>
      <div class="voice">
        <div class="orb" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <p class="quote" id="quote" aria-live="polite"></p>
        <button class="play" id="play">Play Claudia’s voice</button>
      </div>
      <fieldset><legend>Answer as Grete</legend><div class="choices">
        <button id="mic" aria-describedby="mic-note" hidden>Answer by voice</button>
        <button data-answer="taken" aria-pressed="false">Taken</button>
        <button data-answer="away" aria-pressed="false">Not at home</button>
        <button data-answer="forgot" aria-pressed="false">Forgot</button>
      </div><p class="mic-note" id="mic-note" hidden>Your browser may process microphone audio online.</p><p class="mic-note" id="mic-status" role="status"></p></fieldset>
    </section>
    <section class="diary" aria-labelledby="jonas"><div class="role"><h2 id="jonas">Jonas’s family diary</h2><span class="date">Today</span></div>
      <h3 class="diary-title">Grete’s morning</h3>
      <div id="updates" aria-live="polite" aria-atomic="true"></div>
      <div class="entry"><time>08:00</time><p><strong>Tablet check</strong><span>Claudia asked about the morning tablets.</span></p></div>
    </section>
  </div>
  <footer>Interactive demo · Fictional family and diary entries</footer>
</main>
<script type="application/json" id="voice-lines">
{
  "prompt": "Good morning, Grete. It's eight o'clock. Have you taken your morning tablets?",
  "taken": "Thank you, Grete. I've noted it.",
  "away": "All right. I'll remind you again at ten, when you're back.",
  "forgot": "Thank you for telling me, Grete. I've noted it in your diary."
}
</script>
<script>
const lines = JSON.parse(document.getElementById('voice-lines').textContent);
const entries = {
  taken: ['Tablets taken', 'Grete confirmed her morning tablets. Recorded in her diary.'],
  away: ['Reminder moved to 10:00', 'Grete is away from home. Claudia will check in again.'],
  forgot: ['Tablets forgotten', 'Grete said she forgot. First missed intake recorded.']
};
const quote = document.querySelector('#quote');
const orb = document.querySelector('.orb');
const play = document.querySelector('#play');
const updates = document.querySelector('#updates');
const answers = document.querySelectorAll('[data-answer]');
let selected = 'prompt';
let playback = 0;
let audio;
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.querySelector('#mic');
const micStatus = document.querySelector('#mic-status');
let listener;
function endListening() {
  const active = listener;
  listener = null;
  if (active) active.abort();
  mic.textContent = 'Answer by voice';
  micStatus.textContent = '';
}
function answerByVoice() {
  if (listener) { endListening(); return; }
  stop();
  const active = new Recognition();
  listener = active;
  active.lang = 'en-GB';
  mic.textContent = 'Cancel listening';
  micStatus.textContent = 'Say “taken”, “not at home”, or “forgot”.';
  const chooseButton = 'Choose one of the three answer buttons.';
  active.onresult = event => {
    if (listener !== active) return;
    const words = event.results[0][0].transcript.toLowerCase().replace(/[’']/g, '').replace(/[^a-z ]+/g, ' ').trim().replace(/ +/g, ' ');
    const phrases = {
      taken: ['taken', 'yes', 'i took them', 'yes i took them', 'ive taken them', 'i have taken them'],
      away: ['not at home', 'im not at home', 'i am not at home', 'im away'],
      forgot: ['forgot', 'i forgot', 'i forgot them', 'oh i forgot them']
    };
    const match = Object.keys(phrases).find(key => phrases[key].includes(words));
    endListening();
    if (match) { display(match); speak(); }
    else micStatus.textContent = 'Claudia couldn’t match that reply. ' + chooseButton;
  };
  function failed(message) {
    if (listener !== active) return;
    endListening();
    micStatus.textContent = message + ' ' + chooseButton;
  }
  active.onerror = () => failed('Voice input is unavailable.');
  active.onend = () => failed('No reply heard.');
  try { active.start(); } catch { failed('Voice input is unavailable.'); }
}
if (Recognition) {
  mic.hidden = false;
  document.querySelector('#mic-note').hidden = false;
  mic.addEventListener('click', answerByVoice);
}
function stop() {
  endListening();
  playback++;
  if (audio) audio.pause();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  orb.classList.remove('speaking');
}
async function speak() {
  stop();
  const id = playback;
  const clip = new Audio('media/' + selected + '.mp3');
  audio = clip;
  function ended() { if (id === playback) orb.classList.remove('speaking'); }
  clip.onended = ended;
  try {
    await clip.play();
    if (id === playback) orb.classList.add('speaking');
  } catch {
    if (id !== playback || !('speechSynthesis' in window)) return;
    const utterance = new SpeechSynthesisUtterance(lines[selected]);
    utterance.lang = 'en-GB';
    utterance.rate = .94;
    utterance.onstart = () => { if (id === playback) orb.classList.add('speaking'); };
    utterance.onend = ended;
    utterance.onerror = ended;
    speechSynthesis.speak(utterance);
  }
}
function display(key) {
  selected = key;
  quote.textContent = '“' + lines[key] + '”';
  answers.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.answer === key)));
  updates.replaceChildren();
  document.querySelector('#phone-time').textContent = key === 'prompt' ? '08:00' : '08:04';
  if (key === 'prompt') { play.textContent = 'Play Claudia’s voice'; return; }
  play.textContent = 'Replay Claudia’s reply';
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.dataset.status = key;
  const time = document.createElement('time');
  time.textContent = '08:04';
  const detail = document.createElement('p');
  const title = document.createElement('strong');
  title.textContent = entries[key][0];
  const description = document.createElement('span');
  description.textContent = entries[key][1];
  detail.append(title, description);
  entry.append(time, detail);
  updates.append(entry);
}
display('prompt');
play.addEventListener('click', speak);
answers.forEach(button => button.addEventListener('click', () => { display(button.dataset.answer); speak(); }));
document.querySelector('#restart').addEventListener('click', () => { stop(); display('prompt'); play.focus(); });
</script>
</body>
</html>
