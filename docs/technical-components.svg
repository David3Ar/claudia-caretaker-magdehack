<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1815" viewBox="0 0 1200 1815" role="img" aria-labelledby="title description">
  <title id="title">Claudia — proposed technical components</title>
  <desc id="description">Top-to-bottom component sketch. The senior uses a dedicated phone with a proposed local Cactus Whistle model for activation and transcription, plus on-device integrations. Data groups PARA agent memory with embedding-based retrieval and client-side record access, connected to encrypted public-cloud storage. The caregiver uses a companion phone app or web app. Requests enter the Claudia gateway through a top-centred LiteLLM ingress, then pass down through a pseudonymiser with a temporary mapping alongside it, before branching to a proposed fine-tuned Gemma 4 model and voice services. A temporary mapping stays in the gateway. Clients encrypt personal records before cloud storage. Key sharing, phone performance and provider choices remain open.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; stroke: none; }
      .ingress { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .service { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.5; }
      .storage { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .external { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
      .boundary { fill: none; stroke: #cbd5e1; stroke-width: 1.5; }
      .heading { font-size: 20px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .role { font-size: 17px; fill: #475569; }
      .note { font-size: 17px; fill: #475569; }
      .main { fill: none; stroke: #15803d; stroke-width: 3; marker-end: url(#arrow); }
      .secondary { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 4 6; marker-end: url(#secondary-arrow); }
      .actor-line { fill: none; stroke: #b45309; stroke-width: 3; stroke-linecap: round; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#15803d"/></marker>
    <marker id="secondary-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="1200" height="1815" fill="#fff"/>
  <text x="48" y="48" font-size="29" font-weight="700">Claudia — proposed technical components</text>
  <text x="48" y="80" class="note">Local listening. Limited inference context. Client-encrypted records.</text>

  <!-- Boundaries precede components and connections. -->
  <rect x="48" y="275" width="520" height="635" rx="12" class="boundary"/>
  <text x="70" y="304" class="heading">Senior's phone</text>
  <rect x="632" y="275" width="520" height="160" rx="12" class="boundary"/>
  <text x="654" y="304" class="heading">Caregiver devices</text>
  <rect x="64" y="665" width="488" height="230" rx="10" class="boundary" stroke-dasharray="6 5"/>
  <text x="84" y="694" class="heading">Data</text>
  <rect x="48" y="945" width="1104" height="360" rx="12" class="boundary"/>
  <text x="70" y="975" class="heading">Claudia gateway</text>
  <rect x="48" y="1370" width="1104" height="185" rx="12" class="boundary"/>
  <text x="488" y="1401" class="heading">Inference and voice</text>
  <rect x="48" y="1610" width="1104" height="145" rx="12" class="boundary"/>
  <text x="70" y="1641" class="heading">Public-cloud storage</text>

  <!-- People are explicitly drawn as stick figures. -->
  <g id="senior-g" class="external" aria-label="Senior, caretaker">
    <circle cx="308" cy="134" r="17"/>
    <path d="M308 151 V194 M277 171 L308 161 L339 171 M308 194 L284 221 M308 194 L332 221" class="actor-line"/>
    <text x="362" y="166" class="label">Senior</text>
    <text x="362" y="191" class="role" font-style="italic" font-weight="300">caretaker</text>
  </g>
  <g id="caregiver-c" class="external" aria-label="Companion, caregiver">
    <circle cx="892" cy="134" r="17"/>
    <path d="M892 151 V194 M861 171 L892 161 L923 171 M892 194 L868 221 M892 194 L916 221" class="actor-line"/>
    <text x="946" y="166" class="label">Companion</text>
    <text x="946" y="191" class="role" font-style="italic" font-weight="300">caregiver</text>
  </g>

  <g id="senior-app" class="ingress">
    <rect x="80" y="325" width="456" height="80" rx="9"/>
    <text x="308" y="357" text-anchor="middle" class="label">Senior app</text>
    <text x="308" y="384" text-anchor="middle" class="role">Full-screen voice interface</text>
  </g>
  <g id="on-device" class="service">
    <rect x="80" y="445" width="456" height="80" rx="9"/>
    <text x="308" y="476" text-anchor="middle" class="label">Cactus Whistle</text>
    <text x="308" y="503" text-anchor="middle" class="role">Local activation · STT · connectors</text>
  </g>
  <g id="agent-loop" class="service">
    <rect x="80" y="565" width="456" height="80" rx="9"/>
    <text x="308" y="596" text-anchor="middle" class="label">Agent loop</text>
    <text x="308" y="623" text-anchor="middle" class="role">Orchestration · tool calls</text>
  </g>
  <g id="companion-app" class="ingress">
    <rect x="664" y="325" width="215" height="80" rx="9"/>
    <text x="771.5" y="357" text-anchor="middle" class="label">Companion app</text>
    <text x="771.5" y="384" text-anchor="middle" class="role">Voice · notifications</text>
  </g>
  <g id="web-app" class="ingress">
    <rect x="903" y="325" width="217" height="80" rx="9"/>
    <text x="1011.5" y="357" text-anchor="middle" class="label">Web app</text>
    <text x="1011.5" y="384" text-anchor="middle" class="role">Caregiver controls</text>
  </g>
  <g id="data" aria-label="Data: agent memory and client-side record access">
    <g id="agent-memory" class="service">
      <rect x="80" y="705" width="456" height="80" rx="9"/>
      <text x="308" y="736" text-anchor="middle" class="label">Agent memory</text>
      <text x="308" y="763" text-anchor="middle" class="role">PARA · embeddings</text>
    </g>
    <g id="local-data" class="storage">
      <rect x="80" y="795" width="456" height="80" rx="9"/>
      <text x="308" y="826" text-anchor="middle" class="label">Client-side record access</text>
      <text x="308" y="853" text-anchor="middle" class="role">Encrypted sync · key sharing still open</text>
    </g>
  </g>
  <g id="router" class="ingress">
    <rect x="410" y="1005" width="380" height="80" rx="9"/>
    <text x="600" y="1036" text-anchor="middle" class="label">LiteLLM</text>
    <text x="600" y="1063" text-anchor="middle" class="role">Ingress · company API identity</text>
  </g>
  <g id="pseudonymiser" class="service">
    <rect x="410" y="1125" width="380" height="100" rx="9"/>
    <text x="600" y="1164" text-anchor="middle" class="label">Pseudonymiser</text>
    <text x="600" y="1193" text-anchor="middle" class="role">Hosted identifier detection · placeholders</text>
  </g>
  <g id="mapping" class="storage">
    <rect x="850" y="1125" width="270" height="100" rx="9"/>
    <text x="985" y="1164" text-anchor="middle" class="label">Temporary mapping</text>
    <text x="985" y="1193" text-anchor="middle" class="role">Short-lived re-identification</text>
  </g>
  <g id="llm" class="external">
    <rect x="80" y="1425" width="490" height="95" rx="9"/>
    <text x="325" y="1463" text-anchor="middle" class="label">Fine-tuned Gemma 4</text>
    <text x="325" y="1492" text-anchor="middle" class="role">Text inference · predefined tool calls</text>
  </g>
  <g id="tts" class="external">
    <rect x="630" y="1425" width="490" height="95" rx="9"/>
    <text x="875" y="1463" text-anchor="middle" class="label">Voice synthesis</text>
    <text x="875" y="1492" text-anchor="middle" class="role">Privacy-qualified ElevenLabs or hosted Qwen</text>
  </g>
  <g id="cloud-records" class="storage">
    <rect x="200" y="1660" width="800" height="70" rx="9"/>
    <text x="600" y="1689" text-anchor="middle" class="label">Encrypted object store</text>
    <text x="600" y="1715" text-anchor="middle" class="role">Memories · diary · calendar · no company-held decryption key</text>
  </g>

  <!-- Main request paths. Replies return via the gateway; devices validate commands. -->
  <path d="M308 225 V325" class="main"/>
  <path d="M892 225 V245 H771.5 V325" class="main"/>
  <path d="M892 245 H1011.5 V325" class="main"/>
  <path d="M308 405 V445" class="main"/>
  <path d="M308 525 V565" class="main"/>
  <path d="M536 605 H600 V1005" class="main"/>
  <path d="M771.5 405 V425 H600 V605" fill="none" stroke="#15803d" stroke-width="3"/>
  <path d="M1011.5 405 V425 H600" fill="none" stroke="#15803d" stroke-width="3"/>
  <path d="M600 1085 V1125" class="main"/>
  <path d="M600 1225 V1335 H325 V1425" class="main"/>
  <path d="M600 1335 H875 V1425" class="main"/>

  <!-- Secondary paths stay outside the main inference path. -->
  <path d="M790 1175 H850" class="secondary"/>
  <path d="M64 780 H24 V1695 H200" class="secondary"/>
  <path d="M1152 355 H1176 V1695 H1000" class="secondary"/>

  <text x="48" y="1795" class="note">Proposal, not implementation. Phone benchmarks, key lifecycle and provider privacy terms remain open.</text>
</svg>
