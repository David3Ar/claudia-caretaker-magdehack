<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Location Flows</title>
<meta name="description" content="The five live location and emergency flows of Claudia, step by step. Pick a flow, then go through it screen by screen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Tokens and components follow docs/design.html. Page and player are the same as 01-calendar/flows.html */
:root {
  --paper: #ffffff; --mist: #edf1ef; --ink: #000000; --ink-soft: #5c6662;
  --lime: #c6f432; --amber: #ffb23e; --coral: #ff5a3c; --hair: rgb(0 0 0 / 0.12);
  --sans: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: Newsreader, Georgia, serif;
  --r-s: 0.75rem; --r-m: 1.5rem; --r-l: 2.75rem;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--paper); line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, h5, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.soft { color: var(--ink-soft); }
.num { font-variant-numeric: tabular-nums; }
.said { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Page */
.page { max-width: 86rem; margin: 0 auto; padding: 1.5rem clamp(1rem, 4vw, 3rem) 3rem; display: grid; gap: 1.5rem; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem; }
.brand { display: flex; align-items: center; gap: 0.625rem; font-weight: 800; font-size: 1.25rem; letter-spacing: -0.03em; margin-right: auto; }
.head a { color: var(--ink); }
.picker { display: flex; flex-wrap: wrap; gap: 0.375rem; }
.picker button { border: 0; padding: 0.625rem 1.125rem; border-radius: 99rem; background: var(--mist); font-weight: 600; text-align: left; }
.picker button span { color: var(--ink-soft); font-weight: 400; margin-right: 0.375rem; }
.picker button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.picker button[aria-pressed="true"] span { color: rgb(255 255 255 / 0.65); }

/* Stage: text and controls left, device right */
.stage { display: grid; grid-template-columns: minmax(0, 24rem) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 4rem); align-items: start; }
.info { display: grid; gap: 1.25rem; position: sticky; top: 1.5rem; }
.info h1 { font-size: clamp(2.25rem, 4.4vw, 3.75rem); font-weight: 800; letter-spacing: -0.05em; line-height: 0.95; }
.count { font-size: 1.0625rem; color: var(--ink-soft); }
.actor { display: inline-flex; align-items: center; gap: 0.5rem; justify-self: start; padding: 0.25rem 0.875rem 0.25rem 0.25rem; border-radius: 99rem; background: var(--mist); font-weight: 600; }
.actor .who, .actor .orb { --s: 1.75rem; width: 1.75rem; height: 1.75rem; }
.info h2 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.info .why { color: var(--ink-soft); max-width: 34ch; font-size: 1.0625rem; }
.example[hidden] { display: none; }
.example { display: inline-block; padding: 0.125rem 0.625rem; border-radius: 99rem; box-shadow: inset 0 0 0 1px var(--hair); font-size: 0.875rem; color: var(--ink-soft); justify-self: start; }
.nav { display: flex; align-items: center; gap: 0.5rem; }
.dots { display: flex; gap: 0.25rem; margin: 0 0.5rem; flex-wrap: wrap; }
.dots button { width: 2rem; height: 2rem; border: 0; border-radius: 50%; background: var(--mist); font-weight: 600; font-size: 0.875rem; }
.dots button[aria-current="step"] { background: var(--ink); color: var(--paper); }
.hint { font-size: 0.875rem; color: var(--ink-soft); }
.device { display: grid; justify-items: center; gap: 0.875rem; min-width: 0; }
.device > p { font-size: 0.9375rem; color: var(--ink-soft); }

/* Components from design.html */
.orb { --s: 10rem; position: relative; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: grid; place-items: center; isolation: isolate; }
.orb::before { content: ""; position: absolute; inset: 0; z-index: -2; border-radius: 50%; background: conic-gradient(var(--lime), var(--amber), var(--coral), var(--amber), var(--lime)); filter: blur(calc(var(--s) * 0.055)); animation: spin 14s linear infinite; }
.orb::after { content: ""; position: absolute; inset: 7%; z-index: -1; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #ffffff, #e6eae8 75%); }
.bars { display: flex; align-items: center; gap: calc(var(--s) * 0.045); height: calc(var(--s) * 0.32); }
.bars i { width: calc(var(--s) * 0.055); height: 100%; border-radius: 99rem; background: var(--ink); transform: scaleY(0.17); }
.orb[data-state="idle"] .bars { opacity: 0.35; }
.orb[data-state="listening"]::after { inset: 13%; }
.orb[data-state="listening"]::before { animation: spin 14s linear infinite, breathe 1.6s ease-in-out infinite; }
.orb[data-state="thinking"]::before { animation-duration: 2.2s; }
.orb[data-state="thinking"]::after { inset: 4%; }
.orb[data-state="thinking"] .bars i { animation: hop 0.9s ease-in-out infinite; }
.orb[data-state="speaking"] .bars i { animation: talk 0.7s ease-in-out infinite alternate; }
.bars i:nth-child(2) { animation-delay: -0.45s !important; }
.bars i:nth-child(3) { animation-delay: -0.2s !important; }
.bars i:nth-child(4) { animation-delay: -0.6s !important; }
.bars i:nth-child(5) { animation-delay: -0.3s !important; }
@keyframes spin { to { rotate: 1turn; } }
@keyframes breathe { 50% { scale: 1.09; } }
@keyframes talk { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
@keyframes hop { 0%, 100% { transform: scaleY(0.17) translateY(0); } 50% { transform: scaleY(0.17) translateY(-160%); } }
@keyframes live { 50% { opacity: 0.35; } }

.phone { width: 20rem; max-width: 100%; aspect-ratio: 9 / 18.5; border: 2px solid var(--ink); border-radius: var(--r-l); background: var(--paper); padding: 1.25rem 1.125rem 1.125rem; display: flex; flex-direction: column; gap: 0.875rem; overflow: hidden; }
.phone::before { content: ""; align-self: center; width: 4.5rem; height: 1.125rem; border-radius: 99rem; background: var(--ink); flex: none; }
.phone.dark { background: var(--ink); color: var(--paper); }
.phone.dark::before { background: #262626; }
.phone.alarm { background: var(--coral); }
.grow { flex: 1; display: grid; place-items: center; align-content: center; gap: 1.25rem; text-align: center; min-height: 0; }
.grow.left { justify-items: start; text-align: left; }
.grow.top { align-content: start; justify-items: stretch; text-align: left; gap: 0.875rem; }
.p-hello { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.p-said { font-size: 1.5rem; line-height: 1.15; }
.p-heard { font-size: 1.4375rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.p-q { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; }
.listening { font-size: 0.9375rem; color: rgb(255 255 255 / 0.6); text-align: center; }
.big { display: flex; align-items: center; justify-content: center; gap: 0.625rem; width: 100%; min-height: 4rem; padding: 0.75rem 1rem; border-radius: var(--r-m); background: var(--ink); color: var(--paper); font-size: 1.25rem; font-weight: 700; text-align: center; line-height: 1.1; flex: none; }
.big.sos { background: var(--coral); color: var(--ink); }
.big.yes { background: var(--lime); color: var(--ink); }
.big.ghost { background: none; color: inherit; box-shadow: inset 0 0 0 2px currentColor; }
.big.mid { min-height: 3.25rem; font-size: 1.0625rem; }
.tag { justify-self: start; display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.75rem; border-radius: 99rem; background: var(--paper); box-shadow: inset 0 0 0 1px var(--hair); font-size: 0.9375rem; font-weight: 500; white-space: nowrap; }
.tag::before { content: ""; width: 0.625rem; height: 0.625rem; border-radius: 50%; background: var(--dot, var(--lime)); box-shadow: 0 0 0 1px rgb(0 0 0 / 0.35); flex: none; }
.tag.inv { background: var(--ink); color: var(--paper); box-shadow: none; }
.grow:not(.left):not(.top) .tag { justify-self: center; }
.who { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 0.8125rem; font-weight: 700; flex: none; }
.who.b { background: var(--mist); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.who.g { background: var(--lime); color: var(--ink); }
.who.xl { width: 6rem; height: 6rem; font-size: 2.5rem; }
.rows li { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 0; border-bottom: 1px solid var(--hair); line-height: 1.25; }
.rows li:last-child { border-bottom: 0; }
.rows .t { width: 3.5rem; flex: none; font-weight: 600; }
.rows .what { flex: 1; min-width: 0; }
.rows .what span { display: block; color: var(--ink-soft); font-size: 0.875rem; }
.tabbar { display: flex; align-items: center; justify-content: space-between; padding: 0 0.75rem; flex: none; margin-top: auto; }
.tabbar .mic { display: grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 1.125rem; }
.tabbar .side { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 50%; background: var(--mist); }
.tabbar .side.on { background: var(--ink); color: var(--paper); }

/* Hands-free: wake word pill and the words to say instead of buttons */
.wake { display: inline-flex; align-items: center; gap: 0.5rem; align-self: center; padding: 0.5rem 0.875rem; border-radius: 99rem; background: var(--mist); font-size: 1rem; font-weight: 600; white-space: nowrap; flex: none; }
.wake::before { content: ""; width: 0.625rem; height: 0.625rem; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 1px rgb(0 0 0 / 0.35); animation: live 2s ease-in-out infinite; }
.phone.dark .wake { background: rgb(255 255 255 / 0.14); }
.phone.alarm .wake { background: rgb(0 0 0 / 0.12); }
.say { display: grid; gap: 0.5rem; justify-items: center; flex: none; padding-bottom: 0.25rem; }
.say small { font-size: 0.875rem; opacity: 0.7; }
.say div { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.375rem; }
.say span { padding: 0.5rem 0.875rem; border-radius: 99rem; box-shadow: inset 0 0 0 1.5px currentColor; font-weight: 600; font-size: 1.0625rem; }

/* Location */
.map { position: relative; border-radius: var(--r-s); background: var(--mist); overflow: hidden; min-height: 10rem; flex: none; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map .here { position: absolute; left: 0.625rem; bottom: 0.625rem; max-width: calc(100% - 1.25rem); padding: 0.5rem 0.875rem; border-radius: var(--r-s); background: var(--ink); color: var(--paper); line-height: 1.2; font-size: 0.875rem; }
.map .here b { display: block; color: var(--lime); font-size: 1.0625rem; }
.map .here.alert b { color: var(--coral); }
.places li { display: grid; grid-template-columns: 3rem 1rem 1fr; align-items: center; gap: 0.375rem; padding: 0.3rem 0; font-size: 0.9375rem; line-height: 1.2; }
.places .t { font-weight: 600; }
.places i { width: 0.625rem; height: 0.625rem; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); justify-self: center; }
.places li.now i { background: var(--lime); box-shadow: 0 0 0 1px rgb(0 0 0 / 0.35); }
.places li.move { color: var(--ink-soft); }
.places li.move i { width: 2px; height: 1rem; border-radius: 0; box-shadow: none; background: #b4bdb9; }
.note { display: grid; gap: 0.625rem; padding: 0.875rem; border-radius: var(--r-m); background: var(--amber); text-align: left; }
.note b { font-size: 1.25rem; letter-spacing: -0.02em; line-height: 1.1; }
.note span { font-size: 0.875rem; }
.note .acts { display: flex; gap: 0.375rem; }
.pill { display: inline-flex; align-items: center; gap: 0.375rem; min-height: 2.25rem; padding: 0 0.875rem; border-radius: 99rem; background: var(--ink); color: var(--paper); font-size: 0.9375rem; font-weight: 600; }
.pill.line { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }

/* Web dashboard: location view */
.screen { width: 100%; max-width: 56rem; }
.dash { background: var(--mist); border-radius: var(--r-l); padding: clamp(0.75rem, 2vw, 1.5rem); display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 0.625rem; }
.dash-top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.5rem 2rem; padding: 0.25rem 0.5rem; }
.dash-top h3 { font-size: 2rem; font-weight: 700; letter-spacing: -0.045em; line-height: 1; margin-right: auto; }
.stat b { display: block; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.05em; line-height: 1; }
.stat span { color: var(--ink-soft); font-size: 0.875rem; }
.card { background: var(--paper); border-radius: var(--r-m); padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
.card h4 { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 1rem; font-weight: 600; }
.card.wide { grid-column: 1 / -1; }
.card .map { flex: 1; min-height: 14rem; }
.prefs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1.5rem; }
.prefs li { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 0; border-bottom: 1px solid var(--hair); font-size: 0.9375rem; line-height: 1.25; }
.prefs div { flex: 1; }
.prefs div span { display: block; color: var(--ink-soft); font-size: 0.8125rem; }
.switch { position: relative; width: 2.75rem; height: 1.625rem; flex: none; border-radius: 99rem; background: #c3cbc7; }
.switch::after { content: ""; position: absolute; top: 0.1875rem; left: 0.1875rem; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--paper); }
.switch.on { background: var(--ink); }
.switch.on::after { left: 1.3125rem; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .orb[data-state="speaking"] .bars i:nth-child(odd) { transform: scaleY(0.9); } .orb[data-state="speaking"] .bars i:nth-child(even) { transform: scaleY(0.5); } }
@media (max-width: 60rem) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .info { position: static; }
  .dash, .prefs { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11"/><circle cx="12" cy="10" r="2.5"/></symbol>
</svg>

<div class="page">
  <header class="head">
    <span class="brand"><span class="orb" style="--s:1.75rem" data-state="idle"></span>Claudia, live location flows</span>
    <a href="spec.md">Spec</a>
    <a href="../../design.html">Design</a>
  </header>
  <nav class="picker" id="picker" aria-label="Flow"></nav>
  <main class="stage">
    <section class="info" aria-live="polite">
      <h1 id="flow-title"></h1>
      <p class="count" id="count"></p>
      <span class="actor" id="actor"></span>
      <h2 id="step-title"></h2>
      <p class="why" id="step-why"></p>
      <span class="example" id="example" hidden>Example content, open in the spec</span>
      <div class="nav">
        <button type="button" class="big mid ghost" id="prev" style="width:auto;padding:0 1.25rem">Back</button>
        <div class="dots" id="dots"></div>
        <button type="button" class="big mid" id="next" style="width:auto;padding:0 1.5rem">Next</button>
      </div>
      <p class="hint">Arrow keys work too. People, times and places are made up.</p>
    </section>
    <section class="device">
      <p id="dev-label"></p>
      <div id="dev" style="display:contents"></div>
    </section>
  </main>
</div>

<script>
(() => {
  const ic = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
  const orb = (state, s) => `<div class="orb" data-state="${state}" style="--s:${s}rem" aria-hidden="true"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span></div>`;
  const wake = `<span class="wake">Say “Hey Claudia”</span>`;
  const fixed = `${wake}<span class="big">${ic("phone")}Call Jonas</span><span class="big sos">Emergency</span>`;
  const tabbar = (pin) => `<div class="tabbar"><span class="side${pin ? " on" : ""}">${ic("pin")}</span><span class="mic">${ic("mic")}</span><span class="side">${ic("plus")}</span></div>`;
  const tag = (t, dot) => `<span class="tag"${dot ? ` style="--dot:var(--${dot})"` : ""}>${t}</span>`;
  const say = (opts, lead = "Just say") => `<div class="say"><small>${lead}</small><div>${opts.map((o) => `<span>“${o}”</span>`).join("")}</div></div>`;

  // Grete: idle home keeps Call Jonas and Emergency as fallback. Once Claudia talks, nothing needs a tap.
  const hear = (text) => `<div class="phone dark"><div class="grow">${orb("listening", 9.5)}<p class="p-heard">${text}</p></div><p class="listening">Listening, hands-free</p></div>`;
  const gSay = (text, state = "speaking", extra = "") => `<div class="phone"><div class="grow">${orb(state, 7.5)}<p class="p-said said">${text}</p>${extra}</div>${fixed}</div>`;
  const gVoice = (text, opts, state = "speaking", extra = "") => `<div class="phone"><div class="grow">${orb(state, 7.5)}<p class="p-said said">${text}</p>${extra}</div>${say(opts)}</div>`;
  const gCalling = `<div class="phone"><div class="grow">${orb("speaking", 4.5)}<p class="p-said said">Calling Jonas.</p><span class="who xl">J</span><p class="p-hello">Ringing…</p></div>${say(["Hey Claudia, hang up"], "To stop")}</div>`;
  const gOnCall = `<div class="phone dark"><div class="grow"><span class="who xl g">J</span><p class="p-hello">Talking to Jonas</p><p class="listening num">On speaker · 0:12</p></div>${say(["Hey Claudia, hang up"], "To end")}</div>`;
  const gSos = (text, extra, opts) => `<div class="phone alarm"><div class="grow">${orb("speaking", 7.5)}<p class="p-said said">${text}</p>${extra}</div>${opts ? say(opts, "To cancel, say") : ""}</div>`;

  // Jonas
  const map = (place, sub, x, y, col = "#c6f432", alert = false) => `<div class="map" role="img" aria-label="Map: Grete at ${place}">
    <svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"><path d="M-10 60 150 80 410 30M150 80l30 150M-10 170l190-10 230 40M290 55l20 140"/></g>
      <path d="M180 160c40-20 70-60 115-78" stroke="#000" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" fill="none"/>
      <circle cx="${x}" cy="${y}" r="20" fill="${col}" opacity="0.6"/><circle cx="${x}" cy="${y}" r="8" fill="#000"/>
    </svg><p class="here${alert ? " alert" : ""}"><b>${place}</b>${sub}</p></div>`;
  const places = (rows) => `<ul class="places">${rows.map(([t, p, cls = ""]) => `<li class="${cls}"><span class="t num">${t}</span><i></i><span>${p}</span></li>`).join("")}</ul>`;
  const today = `<ul class="rows"><li><span class="t num">8:04</span><span class="what">Morning tablets<span>Taken</span></span></li><li><span class="t num">14:30</span><span class="what">Doctor<span>Anna is driving</span></span><span class="who b">A</span></li></ul>`;
  const cToday = (title, status, extra = "") => `<div class="phone"><p class="p-hello">${title}</p><div class="grow top">${status}${extra}${today}</div>${tabbar(false)}</div>`;
  const cMap = (place, sub, x, y, status, rows) => `<div class="phone"><p class="p-hello">Where Grete is</p><div class="grow top">${status}${map(place, sub, x, y)}${places(rows)}</div>${tabbar(true)}</div>`;
  const note = (title, sub, yes, no) => `<div class="note"><b>${title}</b><span>${sub}</span><div class="acts"><span class="pill">${ic("phone")}${yes}</span><span class="pill line">${no}</span></div></div>`;
  const cCalling = (title, line) => `<div class="phone dark"><div class="grow"><span class="who xl b">G</span><p class="p-hello">${title}</p><p class="listening">${line}</p></div><span class="big sos">End call</span></div>`;
  const cIncoming = `<div class="phone dark"><div class="grow"><span class="who xl b">G</span><p class="p-hello">Grete is calling</p><p class="listening">via Claudia · at home</p></div><span class="big yes">${ic("phone")}Answer</span><span class="big ghost">Decline</span></div>`;
  const cAlert = (time, title, where) => `<div class="phone alarm"><span class="tag inv" style="--dot:var(--coral)">${time}</span><div class="grow left"><p class="p-q">${title}</p><p>${where}</p></div><span class="big">${ic("phone")}Call Grete</span><span class="big ghost">I'm on my way</span></div>`;
  const cOnWay = `<div class="phone"><p class="p-hello">You're on your way</p><div class="grow top">${tag("Emergency, 10:42", "coral")}${map("Grete", "At home, Breiter Weg 12", 180, 160, "#ff5a3c", true)}<ul class="rows"><li><span class="what">Grete heard it<span>“Jonas is on his way.”</span></span></li><li><span class="who b">A</span><span class="what">Anna knows<span>She sees that you're handling it</span></span></li></ul></div><span class="big yes">Grete is safe</span></div>`;
  const cSafe = `<div class="phone"><p class="p-hello">Grete is safe</p><div class="grow top">${tag("Jonas is with her, 11:05")}<ul class="rows"><li><span class="t num">10:42</span><span class="what">Called for help<span>Jonas went over</span></span><span class="who">J</span></li><li><span class="t num">14:30</span><span class="what">Doctor<span>Anna is driving</span></span><span class="who b">A</span></li></ul></div>${tabbar(false)}</div>`;
  const sw = (on) => `<span class="switch${on ? " on" : ""}" aria-hidden="true"></span>`;
  const dash = `<div class="screen"><div class="dash">
    <div class="dash-top"><h3>Where Grete is</h3><p class="stat"><b>At home</b><span>since 11:20</span></p><p class="stat"><b class="num">2</b><span>places today</span></p></div>
    <div class="card"><h4>Map${tag("At home")}</h4>${map("Home", "Breiter Weg 12 · back from the bakery at 11:20", 230, 95)}</div>
    <div class="card"><h4>Today in places</h4>${places([["8:00", "Home, until 10:32"], ["", "8 min walk", "move"], ["10:40", "Bakery"], ["", "12 min walk", "move"], ["11:20", "<b>Home</b>", "now"]])}</div>
    <div class="card wide"><h4>Who sees what</h4><ul class="prefs">
      <li><div>Anna also sees where Grete is<span>Both caregivers get the same map</span></div>${sw(true)}</li>
      <li><div>Grete may ask where I am<span>She hears “at work”, never an address</span></div>${sw(true)}</li>
      <li><div>Tell me when Grete leaves home<span>Off: you see it when you open the app</span></div>${sw(false)}</li>
      <li><div>Alert me if Grete doesn't answer twice<span>Asked again after 15 minutes</span></div>${sw(true)}</li>
    </ul></div>
  </div></div>`;

  const G = ['<span class="who g">G</span>', "Grete, senior"], JO = ['<span class="who">J</span>', "Jonas, caregiver"];
  const CL = [orb("idle", 1.75), "Claudia"];
  const GP = "Grete's phone", JP = "Jonas's phone", WD = "Where Grete is, web dashboard";
  const home = tag("At home since 11:20");
  const fine = cToday("Grete is doing fine", home);
  const noAnswer = tag("No answer yet", "amber");

  const F = [
    { name: "Where is Grete?", title: "Is Mum all right right now?", steps: [
      { who: JO, dev: JP, t: "Jonas opens the app", why: "The first line answers his question. Grete left home at 10:32; no push was sent.", html: cToday("Grete is out", tag("Out since 10:32", "mist")) },
      { who: JO, dev: JP, t: "He taps the pin", why: "Place name first, map second, today's places in order.", html: cMap("Bakery", "Since 10:40", 295, 82, tag("Out since 10:32", "mist"), [["8:00", "Home"], ["10:32", "Left home", "move"], ["10:40", "<b>Bakery</b>", "now"]]) },
      { who: CL, dev: JP, t: "Grete is back home", why: "The status turns lime by itself. Normal movement stays quiet: still no push.", html: cMap("Home", "Back from the bakery at 11:20", 180, 160, home, [["10:40", "Bakery"], ["11:12", "Walking home", "move"], ["11:20", "<b>Home</b>", "now"]]) },
      { who: JO, dev: WD, t: "The same on the dashboard", why: "A bigger map, the day in places, and who may see what. Settings are sentences about Claudia's behaviour.", html: dash, ex: true },
    ] },
    { name: "Where is my son?", title: "Where is my son?", steps: [
      { who: G, dev: GP, t: "Grete is in the kitchen", why: "The phone lies on the table. Claudia always listens for her name; the green dot shows it.", html: gSay("The doctor is at half past two.", "idle") },
      { who: G, dev: GP, t: "Grete asks", why: "Wake word and question in one breath. The screen turns black and shows her words. Nobody touched the phone.", html: hear("Hey Claudia, where is my son?") },
      { who: CL, dev: GP, t: "Claudia answers", why: "Jonas allows it, so she hears “at work”, never an address. The screen shows what she can say, not buttons.", html: gVoice("Jonas is at work. Shall I ask him to call you?", ["Yes", "No, thanks"]) },
      { who: G, dev: GP, t: "Grete says yes", why: "A spoken yes is enough.", html: hear("Yes, please.") },
      { who: CL, dev: JP, t: "Jonas gets one card", why: "One card, one action: Call Grete.", html: cToday("Grete is doing fine", home, note("Grete would like you to call", "She asked at 14:05", "Call Grete", "Later")) },
      { who: CL, dev: GP, t: "Claudia announces the call", why: "No ringing phone to find. Claudia says who it is.", html: gVoice("Jonas is calling. Shall I put him through?", ["Yes", "Not now"]) },
      { who: G, dev: GP, t: "They talk on speaker", why: "Grete answered with her voice and ends the call the same way.", html: gOnCall },
    ] },
    { name: "Call Jonas", title: "Call my son, now", steps: [
      { who: G, dev: GP, t: "Grete asks for a call", why: "No message, no waiting: she wants to talk now.", html: hear("Hey Claudia, call Jonas.") },
      { who: CL, dev: GP, t: "Claudia rings at once", why: "A direct command needs no question back. The Call Jonas button does the same.", html: gCalling },
      { who: JO, dev: JP, t: "Jonas sees Grete calling", why: "A normal incoming call, marked as coming through Claudia.", html: cIncoming },
      { who: G, dev: GP, t: "They talk on speaker", why: "Same call screen as when Jonas calls her.", html: gOnCall },
    ] },
    { name: "Help!", title: "Hey Claudia, help!", steps: [
      { who: G, dev: GP, t: "Grete has fallen", why: "The phone is on the kitchen table, out of reach. This is why she must never need it in her hand. The Emergency button starts the same flow.", html: hear("Hey Claudia, help!") },
      { who: CL, dev: GP, t: "Claudia raises the alarm", why: "No confirm step. Her screen turns coral and Claudia tells her what happens.", html: gSos("I'm getting help. Jonas and Anna know. Stay where you are.", `<span class="tag inv" style="--dot:var(--coral)">Jonas and Anna told</span>`, ["I'm all right"]) },
      { who: CL, dev: JP, t: "Every caregiver gets the alert", why: "Full screen, with what happened and where she is.", html: cAlert("10:42, just now", "Grete called for help", "She is at home, Breiter Weg 12. She said “Hey Claudia, help!”") },
      { who: JO, dev: JP, t: "Jonas is on his way", why: "One tap. Anna sees that Jonas is handling it. What happens if nobody responds is open.", html: cOnWay, ex: true },
      { who: CL, dev: GP, t: "Claudia tells Grete", why: "Right away, and she stays with her.", html: gSos("Jonas is on his way, Grete. I'm here with you.", `<span class="tag inv">Jonas is coming</span>`) },
      { who: JO, dev: JP, t: "Grete is safe", why: "Both apps return to calm. The alert stays in today's list.", html: cSafe, ex: true },
    ] },
    { name: "No answer", title: "Grete doesn't answer", steps: [
      { who: CL, dev: GP, t: "Claudia speaks first", why: "At 8:00 her planned greeting is the check. She listens for an answer. Nothing reaches Jonas yet.", html: gVoice("Good morning, Grete. Are you awake?", ["Yes, I'm fine"], "listening", noAnswer) },
      { who: CL, dev: GP, t: "Claudia asks again", why: "At 8:15, still silence. Retries and delays are open.", html: gVoice("Grete, are you all right? Just say yes.", ["Yes, I'm fine"], "listening", noAnswer), ex: true },
      { who: CL, dev: JP, t: "Jonas is asked to call", why: "Amber: needs someone.", html: cToday("Grete hasn't answered", tag("Quiet since 8:00", "amber"), note("No answer since 8:00", "Asked twice. She's at home.", "Call Grete", "Wait")) },
      { who: JO, dev: JP, t: "Jonas calls, no answer", why: "Claudia announces his call out loud. Silence again: his call is the last check.", html: cCalling("Calling Grete", "No answer…") },
      { who: CL, dev: JP, t: "Coral for everyone", why: "Same alert as “help”, different first line. What “take action” means next, such as calling 112, is open.", html: cAlert("8:20, just now", "Grete isn't answering", "Last seen at home, Breiter Weg 12, since yesterday 18:10."), ex: true },
    ] },
  ];

  let f = 0, i = 0;
  const $ = (id) => document.getElementById(id);
  const picker = $("picker");
  picker.innerHTML = F.map((x, k) => `<button type="button" data-f="${k}"><span>${k + 1}</span>${x.name}</button>`).join("");
  const render = () => {
    const flow = F[f], s = flow.steps[i];
    picker.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-pressed", k === f));
    $("flow-title").textContent = flow.title;
    $("count").textContent = `Flow ${f + 1} of ${F.length}, step ${i + 1} of ${flow.steps.length}`;
    $("actor").innerHTML = s.who[0] + s.who[1];
    $("step-title").textContent = s.t;
    $("step-why").textContent = s.why;
    $("example").hidden = !s.ex;
    $("dev-label").textContent = s.dev;
    $("dev").innerHTML = s.html;
    $("dots").innerHTML = flow.steps.map((_, k) => `<button type="button" data-k="${k}"${k === i ? ' aria-current="step"' : ""} aria-label="Step ${k + 1}">${k + 1}</button>`).join("");
    $("prev").disabled = f === 0 && i === 0;
    $("next").textContent = i < flow.steps.length - 1 ? "Next" : f < F.length - 1 ? "Next flow" : "Start over";
    history.replaceState(null, "", `#${f + 1}-${i + 1}`);
  };
  const go = (nf, ni) => { f = nf; i = ni; render(); };
  const next = () => (i < F[f].steps.length - 1 ? go(f, i + 1) : go((f + 1) % F.length, 0));
  const prev = () => (i > 0 ? go(f, i - 1) : f > 0 ? go(f - 1, F[f - 1].steps.length - 1) : null);
  picker.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) go(+b.dataset.f, 0); });
  $("dots").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) go(f, +b.dataset.k); });
  $("next").addEventListener("click", next);
  $("prev").addEventListener("click", prev);
  addEventListener("keydown", (e) => { if (e.key === "ArrowRight") next(); if (e.key === "ArrowLeft") prev(); });
  const read = () => {
    const m = location.hash.match(/^#(\d+)(?:-(\d+))?$/);
    if (!m) return render();
    const nf = Math.min(F.length, Math.max(1, +m[1])) - 1;
    go(nf, Math.min(F[nf].steps.length, Math.max(1, +(m[2] || 1))) - 1);
  };
  addEventListener("hashchange", read);
  read();
})();
</script>
</body>
</html>
